<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        body {
            background-color: #e8eced;
            color: #e8eced;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-content:center;
        }
        .card {
            position: relative;
            width: 900px;
            height: 700px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            
            display: flex;
            justify-content: center; 
            padding: 24px;
            border: 4px solid black;
        }
        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            background-image: url('images/christus.webp');
            background-size: cover;
            background-position: center;
            filter: blur(3px) brightness(0.8); 
            transform: scale(1.1); 
            z-index: 1;
        }
        .card-content {
            position: relative;
            width:80%;
            z-index: 2;
        }
        h1, h2 {
            text-align: center;
            text-shadow: 2px 2px 3px black;
        }
        .grid-3 {
            display:flex;
            justify-content: space-around;
            align-items: flex-end;
        }
        .apostle {
            border: 8px solid white;
            border-radius: 100%;
            object-fit: cover;
            aspect-ratio: 1/1;
            width:100px;
            height:100px;
            align-self: center;
            justify-self: center;
        }
        .apostle:hover {
            border-color:#eeeeeeaa;
            filter:brightness(0.8);
        }
        .first-pres {
            width:125px;
            height:125px;
            align-self: flex-end;
        }
        .pres {
            width:150px;
            height:150px;
        }
        .grid-44 {
            display:grid;
            grid-template-columns: repeat(4, 1fr);
            gap:10px
        }
    </style>
</head>
<body>
    <!-- Insert HTML elements here -->
     <div class="card">
        <div class="card-content">
            <h1>First Presidency</h1>
            <div class="grid-3">
                <img src="images/eyring.webp" class="apostle first-pres">
                <img src="images/oaks.webp" class="apostle first-pres pres">
                <img src="images/christofferson.webp" class="apostle first-pres">
            </div>
            <h2>Quorum of the Twelve Apostles</h2>
            <div class="grid-44">
                <img src="images/uchtdorf.webp" class="apostle">
                <img src="images/bednar.webp" class="apostle">
                <img src="images/cook.webp" class="apostle">
                <img src="images/anderson.webp" class="apostle">

                <img src="images/rasband.webp" class="apostle">
                <img src="images/stevenson.webp" class="apostle">
                <img src="images/renlund.webp" class="apostle">
                <img src="images/gong.webp" class="apostle">
                
                <img src="images/soares.webp" class="apostle">
                <img src="images/kearon.webp" class="apostle">
                <img src="images/causse.webp" class="apostle">
                <img src="images/gilbert.webp" class="apostle">
            </div>
        </div>
     </div>
</body>
</html>
