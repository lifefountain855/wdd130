<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
        }
        form {
            margin: 20px auto;
            display:flex;
            flex-direction: column;
            max-width: 400px;
            border: 8px navy solid;
            border-radius: 15px;
            background-color: white;
            position:relative;
            overflow: hidden;
        }
        #closeBtn {
            max-width: fit-content;
            position: absolute;
            top:10px;left:10px;
            z-index: 2;
        }
        #questions {
            padding:20px;
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:15px;
        }
        section {
            align-items:center;
            text-align:center;
            padding:10px;
        }
        h3 {
            text-align: center;
            margin: 10px 0;
        }
        .overlay-text{
            color:white;
            text-shadow: 2px 2px 2px black;
            text-align: center;
        }
        #jesus-img {
            width: 100%;
            display:block;
            aspect-ratio: 10/4;
            object-fit: cover;
            object-position: top;
        }
        .overlay-content {
            position: absolute;
            text-align: center;
            margin-top:40px;
            z-index: 2;
        }
        #img-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #books {
            display:flex;
            justify-content:space-between;
            align-items: flex-end;
            margin-bottom:-20px;
            margin-left:-15px;
            gap:2px;
        }
        .book {
            max-width:80px;
        }
    </style>




</head>

<body>
    <div id="formContainer">
        <form id="myForm">
            <button type="button" id="closeBtn">X</button>
            <div id="img-container">
                <img id="jesus-img" src="images/jesus_feeds_5000.jpeg">
                <div class="overlay-content">
                    <h1 class="overlay-text">Daily Feed</h1>
                    <h2 class="overlay-text">Scripture a Day</h2>
                </div>  
            </div>

            <h3>Sign Up for Daily Scripture Feed</h3>
            <div id="questions">
                <label for="username">User Name:</label>
                <input type="text" id="username" name="username" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label>Gender:</label>
                <div>
                    <input type="radio" id="male" name="gender" value="male" required>
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="female" required>
                    <label for="female">Female</label>
                </div>
            </div>  

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>
            <section id="books">
                <img class="book" src="images/old_testament.webp">
                <img class="book" src="images/new_testament.webp">
                <img class="book" src="images/book_of_mormon.webp">
                <img class="book" src="images/doctrine_and_covenants.webp">
                <img class="book" src="images/pearl_of_great_price.webp">
            </section>
        </form>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
